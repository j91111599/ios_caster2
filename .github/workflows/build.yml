name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-lite-v1

      - name: Setup Theos
        run: |
          set -e
          if [ ! -d "$HOME/theos/makefiles" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          if [ ! -d "$HOME/theos/sdks" ] || [ -z "$(ls -A "$HOME/theos/sdks" 2>/dev/null)" ]; then
            curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
            mkdir -p "$HOME/theos/sdks"
            tar xzf /tmp/sdks.tar.gz -C /tmp
            cp -R /tmp/sdks-master/*.sdk "$HOME/theos/sdks/" || true
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          ls "$HOME/theos/sdks" | head -5

      - name: Build (rootless)
        run: |
          set -e
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ykenginelite-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish deb back to repo
        run: |
          set -e
          mkdir -p dist
          cp packages/*.deb dist/
          ls -la dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: publish deb [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"