name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libplist-2.0-4 libssl3 zstd fakeroot dpkg-dev curl git make
          # Procursus 版 ldid（Linux 可执行）
          sudo curl -fsSL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -2 || true

      - name: Setup Theos
        run: |
          set -e
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls "$THEOS/sdks" | head -5

      - name: Build (rootless)
        run: |
          set -e
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0 \
               TARGET=iphone:clang:latest:14.0 2>&1 | tail -40
          ls -la packages/ || true
          find . -name "*.deb" -maxdepth 3

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykenginelite-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Publish deb back to repo
        if: success()
        run: |
          set -e
          mkdir -p dist
          cp packages/*.deb dist/ 2>/dev/null || echo "no deb"
          ls -la dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: publish deb [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"