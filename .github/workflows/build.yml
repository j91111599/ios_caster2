name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libplist-2.0-4 libssl3 zstd fakeroot dpkg-dev curl git make
          sudo curl -fsSL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          clang --version | head -2

      - name: Setup Theos + toolchain shim
        run: |
          set -e
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          # Linux 上让 theos 用系统 clang/lld
          TC="$THEOS/toolchain/linux/iphone/bin"
          mkdir -p "$TC"
          ln -sf "$(which clang)" "$TC/clang"
          ln -sf "$(which clang++)" "$TC/clang++"
          ln -sf "$(which ld.lld)" "$TC/ld" || true
          STRIP=$(ls /usr/lib/llvm-*/bin/llvm-strip 2>/dev/null | head -1)
          [ -n "$STRIP" ] && ln -sf "$STRIP" "$TC/strip"
          NM=$(ls /usr/lib/llvm-*/bin/llvm-nm 2>/dev/null | head -1)
          [ -n "$NM" ] && ln -sf "$NM" "$TC/nm"
          ls -la "$TC"
          ls -la "$TC"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls "$THEOS/sdks" | head -3

      - name: Fetch OpenCV framework
        run: |
          set -e
          mkdir -p Frameworks
          if [ ! -d Frameworks/opencv2.framework ]; then
            curl -fsSL -o /tmp/ocv.zip https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-ios-framework.zip
            unzip -q /tmp/ocv.zip -d /tmp/ocv
            cp -R /tmp/ocv/opencv2.framework Frameworks/ || true
          fi
          ls Frameworks
          # 把 framework 放进 app bundle，否则 dyld 找不到
          APP=layout/var/jb/Applications/YKEngineApp.app/Frameworks
          mkdir -p "$APP"
          cp -R Frameworks/opencv2.framework "$APP"/
          ls -d "$APP"
          # 瘦身：只留 arm64 切片，去掉模拟器/多余架构与头文件
          FW="$APP/opencv2.framework"
          lipo -thin arm64 "$FW/opencv2" -o /tmp/ocv_arm64 && mv /tmp/ocv_arm64 "$FW/opencv2"
          rm -rf "$FW/Headers" "$FW/Modules" 2>/dev/null || true
          du -sh "$FW" || true

      - name: Build (rootless)
        run: |
          set -euo pipefail
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless THEOS_PACKAGE_ARCH=iphoneos-arm64e FINALPACKAGE=1 DEBUG=0 2>&1 | tail -60
          ls -la packages/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykenginelite-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Publish deb back to repo
        if: success()
        run: |
          mkdir -p dist
          cp packages/*.deb dist/ 2>/dev/null || echo "no deb produced"
          ls -la dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: publish deb [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"